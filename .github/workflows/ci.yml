# Lint, typecheck and test whatever a PR changes (and anything that depends on it).
# Builds aren't repeated here: Vercel builds every PR for each deployed app.
name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only token: CI only reads the code (and the repo is public, so PRs can come from forks).
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck & test (affected)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Turbo can diff against main.
          fetch-depth: 0

      # No version given: uses "packageManager" from package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The apps' lint scripts fix what they can (biome check --write), so fail if
      # that changed anything: the PR has unformatted or auto-fixable code.
      - name: Lint (affected)
        run: |
          bun turbo lint --filter='...[origin/main]'
          git diff --exit-code

      # Whole repo (well under a second): an export becomes unused when a file it never
      # touched stops importing it. Findings in fallow-baseline.json don't fail; new ones do.
      - name: Dead code (Fallow)
        run: bun run dead-code

      - name: Typecheck (affected)
        run: bun turbo check-types --filter='...[origin/main]'

      - name: Test (affected)
        run: bun turbo test --filter='...[origin/main]'
