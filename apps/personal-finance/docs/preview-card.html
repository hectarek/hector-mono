<!doctype html>
<!-- The link-preview card, 1200x630. scripts/render-previews.ts screenshots it once per page with
     ?site=…&title=…&line=…, into public/previews/. A placeholder look until the chosen theme (U9)
     redraws it; raise PREVIEW_VERSION in src/site.ts whenever this file changes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: #ffffff;
        color: #111111;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        border-bottom: 24px solid #111111;
      }
      #site {
        font-size: 32px;
        font-weight: 600;
        color: #444444;
      }
      #title {
        font-size: 76px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -1px;
      }
      #line {
        margin-top: 28px;
        font-size: 36px;
        line-height: 1.3;
        color: #333333;
      }
    </style>
  </head>
  <body>
    <p id="site">Site name</p>
    <div>
      <h1 id="title">Page title</h1>
      <p id="line">One line on what the page does</p>
    </div>
    <script>
      const query = new URLSearchParams(location.search);
      for (const id of ["site", "title", "line"]) {
        document.getElementById(id).textContent = query.get(id) ?? "";
      }
    </script>
  </body>
</html>
