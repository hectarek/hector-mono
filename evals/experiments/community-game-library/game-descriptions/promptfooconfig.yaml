# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Which model writes the best "About" paragraph for a game from its Wikipedia text? README.md has
# the question, the games, how to run it and the results.
description: Game descriptions from Wikipedia text, seven models through OpenCode Zen

prompts:
  - id: file://prompts/v1.json
    label: v1

# Each model is a letter, so the viewer doesn't name it while Hector rates the answers; the
# README's key, folded away, says which is which. They all go through OpenCode Zen's
# OpenAI-compatible endpoint, which translates the request for Claude and Gemini, and they're all
# on Vercel AI Gateway too, for when the experiment moves there.
providers:
  - id: openai:chat:gpt-6.1-sol
    label: A
    config: &zen
      apiBaseUrl: https://opencode.ai/inference/openai/v1
      apiKeyEnvar: OPENCODE_API_KEY
      # Room for a model's thinking as well as the paragraph.
      max_tokens: 4096
  - id: openai:chat:claude-haiku-5-5
    label: B
    config: *zen
  - id: openai:chat:gemini-3.7-flash
    label: C
    config: *zen
  - id: openai:chat:claude-opus-5-5
    label: D
    config: *zen
  - id: openai:chat:gpt-6-luna
    label: E
    config: *zen
  - id: openai:chat:claude-sonnet-5-5
    label: F
    config: *zen
  - id: openai:chat:gemini-4-argon
    label: G
    config: *zen

tests: file://tests/load-articles.mjs:loadArticles

defaultTest:
  assert:
    - type: javascript
      value: file://checks.mjs:copiedWords
      metric: copied words
    - type: javascript
      value: file://checks.mjs:wordCount
      metric: length
    - type: javascript
      value: file://checks.mjs:bannedWords
      metric: banned words
    - type: javascript
      value: file://checks.mjs:noEmDash
      metric: em dash
    - type: javascript
      value: file://checks.mjs:opensWithTitle
      metric: opens with title

evaluateOptions:
  maxConcurrency: 2

sharing: false
